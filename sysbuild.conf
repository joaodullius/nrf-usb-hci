# nRF5340: run the Bluetooth controller (hci_ipc) on the network core.
SB_CONFIG_NETCORE_HCI_IPC=y

# Thingy:53 defaults (MCUboot on app core, b0n secure boot + updates on the
# network core) are kept, but partitions come from devicetree, not Partition
# Manager. Layout mirrors the factory pm_static_thingy53_nrf5340_cpuapp.yml.
SB_CONFIG_PARTITION_MANAGER=n

# MCUboot manages two images: 0 = cpuapp, 1 = cpunet (via PCD / RAM flash sim).
SB_CONFIG_MCUBOOT_NRF53_MULTI_IMAGE_UPDATE=y

# Network core (b0n / NSIB) signing key: MCUboot's public ECDSA P-256 test key,
# shipped with the SDK. Fixed across builds and machines, so the key hash
# provisioned in the device stays valid for later updates. Public key =
# development only; use your own key (and your own MCUboot key) for production.
SB_CONFIG_SECURE_BOOT_SIGNING_KEY_FILE="${ZEPHYR_MCUBOOT_MODULE_DIR}/root-ec-p256-pkcs8.pem"

# Target: nRF5340 modules without external flash. The Thingy:53
# board enables its MX25R64 for MCUboot by default; turn that off so all
# slots live in internal flash (per NCS guidance for dropping external flash).
SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=n
SB_CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=n

# Bootloader setup made explicit (the Thingy:53 sets these as board defaults,
# the EVK-NORA-B12 does not): MCUboot overwrite-only on the app core, b0n on
# the network core, network core updatable through MCUboot.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
SB_CONFIG_SECURE_BOOT_NETCORE=y
SB_CONFIG_NETCORE_APP_UPDATE=y
