# Bluetooth controller exposed to the host over USB (HCI, H4 over USB)
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y

# USB device stack (next) with two functions: BT HCI + CDC ACM
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_PID=0x000B
CONFIG_SAMPLE_USBD_PRODUCT="Zephyr USBD BT HCI"
CONFIG_USBD_BT_HCI=y
CONFIG_USBD_CDC_ACM_CLASS=y

# Release the network core (Bluetooth controller) from reset at boot. Some
# boards (Thingy:53) enable this by default, others (EVK-NORA-B12) do not.
CONFIG_SOC_NRF53_CPUNET_ENABLE=y

# CDC ACM is a UART device; it carries only MCUmgr SMP frames.
# Console framework is required by the SMP UART transport, but no text
# console is attached to the CDC port so printk never mixes with SMP.
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_UART_MCUMGR=y

# MCUmgr (SMP) for firmware update of cpuapp (image 0) and cpunet (image 1)
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

# Keep-alive LED
CONFIG_GPIO=y

